<!doctype html>
<meta charset="utf-8">
<title>Cover render</title>
<style>html,body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style>
<canvas id="c"></canvas>
<script type="module">
// Renders store cover art: ?w=<low-res width>&h=<low-res height>&s=<scale>
import { titleScene } from '../js/art/backdrop.js';
import { spriteCanvas } from '../js/art/sprites.js';
const q = new URLSearchParams(location.search);
const w = +q.get('w') || 320, h = +q.get('h') || 180, s = +q.get('s') || 6;
const low = titleScene(w, h);
const ctx = low.getContext('2d');
const portrait = h > w;

// A hint of the game on the plain: coloured territories with bright
// borders (like the map), a capital in each, and a battleship shelling enemy
// land from a lava sea. No text besides the title.
function hash(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
const horizon = Math.round(h * 0.62);
const blobs = [
  { cx: w * 0.2, cy: h * 0.8, r: Math.min(w, h) * 0.17, fill: [63, 208, 255], edge: '#bff2ff', cap: 'fortress' },
  { cx: w * 0.62, cy: h * 0.82, r: Math.min(w, h) * 0.15, fill: [255, 75, 62], edge: '#ffc4be', cap: 'capital_vulkara' },
  { cx: w * 0.9, cy: h * 0.74, r: Math.min(w, h) * 0.11, fill: [255, 174, 61], edge: '#ffe2a8', cap: 'normal' },
];
const ownerAt = (x, y) => {
  if (y < horizon + 3) return -1;
  let best = -1, bd = 1;
  blobs.forEach((b, k) => {
    const wob = 0.82 + 0.3 * hash(Math.round(Math.atan2(y - b.cy, x - b.cx) * 6), k);
    const d = Math.hypot((x - b.cx) / 1.4, y - b.cy) / (b.r * wob);
    if (d < bd) { bd = d; best = k; }
  });
  return best;
};
const img = ctx.getImageData(0, 0, w, h);
for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
  const o = ownerAt(x, y);
  if (o < 0) continue;
  const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => ownerAt(x + dx, y + dy) !== o);
  const i = (y * w + x) * 4, f = blobs[o].fill;
  if (edge) {
    const c = blobs[o].edge;
    img.data[i] = parseInt(c.slice(1, 3), 16); img.data[i + 1] = parseInt(c.slice(3, 5), 16); img.data[i + 2] = parseInt(c.slice(5, 7), 16);
  } else {
    const k = (x + y) % 4 === 0 ? 0.62 : 0.42; // hatched like the in-game player land
    for (let c = 0; c < 3; c++) img.data[i + c] = Math.round(img.data[i + c] * (1 - k) + f[c] * k);
  }
}
ctx.putImageData(img, 0, 0);
for (const b of blobs) {
  const spr = spriteCanvas(b.cap, '#' + b.fill.map(v => v.toString(16).padStart(2, '0')).join(''));
  ctx.drawImage(spr, Math.round(b.cx - spr.width / 2), Math.round(b.cy - spr.height));
}
// The battleship on the lava pool between the territories, and a shell
// arcing at enemy land.
const ship = spriteCanvas('ship', '#3fd0ff');
const sx = Math.round(w * 0.38), sy = Math.round(h * 0.745);
ctx.drawImage(ship, sx - ship.width, sy - ship.height * 2 + 2, ship.width * 2, ship.height * 2);
const tx = blobs[1].cx - blobs[1].r * 0.2, ty = blobs[1].cy - 2;
for (let k = 0.1; k <= 0.9; k += 0.05) {
  const x = sx + 4 + (tx - sx - 4) * k, y = sy - 10 + (ty - sy + 10) * k - Math.sin(k * Math.PI) * h * 0.08;
  ctx.fillStyle = '#12051e'; ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3);
  ctx.fillStyle = k > 0.7 ? '#ffd25e' : '#fff2a8'; ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
}
for (const [dx, dy, c] of [[0, 0, '#fff6c8'], [1, 0, '#ffd25e'], [-1, 0, '#ff9a3c'], [0, -1, '#ffd25e'], [0, 1, '#ff9a3c'], [2, -1, '#ff7a1f'], [-2, 1, '#ff7a1f']]) {
  ctx.fillStyle = c; ctx.fillRect(Math.round(tx + dx), Math.round(ty + dy - 2), 1, 1);
}

// Crisp pixel lettering: draw text, then snap alpha to on/off pixels.
function pixelText(text, size, cy, top, bottom) {
  const t = document.createElement('canvas');
  t.width = w; t.height = h;
  const x = t.getContext('2d');
  x.font = `900 ${size}px Impact, "Arial Black", sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  let fs = size;
  while (x.measureText(text).width > w * 0.9 && fs > 6) { fs--; x.font = `900 ${fs}px Impact, "Arial Black", sans-serif`; }
  x.fillText(text, w / 2, cy);
  const img = x.getImageData(0, 0, w, h).data;
  const on = (X, Y) => X >= 0 && Y >= 0 && X < w && Y < h && img[(Y * w + X) * 4 + 3] > 110;
  let y0 = h, y1 = 0;
  for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) if (on(X, Y)) { y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); }
  for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) {
    if (on(X, Y)) {
      const k = (Y - y0) / Math.max(1, y1 - y0);
      ctx.fillStyle = k < 0.5 ? top : bottom;
      ctx.fillRect(X, Y, 1, 1);
    } else if (on(X - 1, Y) || on(X + 1, Y) || on(X, Y - 1) || on(X, Y + 1) || on(X - 1, Y - 1) || on(X + 1, Y + 1)) {
      ctx.fillStyle = '#12051e';
      ctx.fillRect(X, Y, 1, 1);
    } else if (on(X - 2, Y - 2) || on(X - 1, Y - 2)) {
      ctx.fillStyle = '#12051e';
      ctx.fillRect(X, Y, 1, 1);
    }
  }
}
const big = Math.round(Math.min(w, h) * (portrait ? 0.17 : 0.16));
pixelText('PLANETFALL', big, Math.round(h * (portrait ? 0.42 : 0.4)), '#ffe08a', '#ff7a1f');
pixelText('CONQUEST', Math.round(big * 0.62), Math.round(h * (portrait ? 0.42 : 0.4) + big * 0.82), '#d8c4ff', '#9a6bff');

const c = document.getElementById('c');
c.width = w * s; c.height = h * s;
const out = c.getContext('2d');
out.imageSmoothingEnabled = false;
out.drawImage(low, 0, 0, c.width, c.height);
document.title = 'ready';
</script>
