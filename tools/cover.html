<!doctype html>
<meta charset="utf-8">
<title>Cover render</title>
<style>html,body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style>
<canvas id="c"></canvas>
<script type="module">
// Renders store cover art: ?w=<low-res width>&h=<low-res height>&s=<scale>
import { titleScene } from '../js/art/backdrop.js';
const q = new URLSearchParams(location.search);
const w = +q.get('w') || 320, h = +q.get('h') || 180, s = +q.get('s') || 6;
const low = titleScene(w, h);
const ctx = low.getContext('2d');

// Crisp pixel lettering: draw text, then snap alpha to on/off pixels.
function pixelText(text, size, cy, top, bottom) {
  const t = document.createElement('canvas');
  t.width = w; t.height = h;
  const x = t.getContext('2d');
  x.font = `900 ${size}px Impact, "Arial Black", sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  let fs = size;
  while (x.measureText(text).width > w * 0.9 && fs > 6) { fs--; x.font = `900 ${fs}px Impact, "Arial Black", sans-serif`; }
  x.fillText(text, w / 2, cy);
  const img = x.getImageData(0, 0, w, h).data;
  const on = (X, Y) => X >= 0 && Y >= 0 && X < w && Y < h && img[(Y * w + X) * 4 + 3] > 110;
  let y0 = h, y1 = 0;
  for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) if (on(X, Y)) { y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); }
  for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) {
    if (on(X, Y)) {
      const k = (Y - y0) / Math.max(1, y1 - y0);
      ctx.fillStyle = k < 0.5 ? top : bottom;
      ctx.fillRect(X, Y, 1, 1);
    } else if (on(X - 1, Y) || on(X + 1, Y) || on(X, Y - 1) || on(X, Y + 1) || on(X - 1, Y - 1) || on(X + 1, Y + 1)) {
      ctx.fillStyle = '#12051e';
      ctx.fillRect(X, Y, 1, 1);
    } else if (on(X - 2, Y - 2) || on(X - 1, Y - 2)) {
      ctx.fillStyle = '#12051e';
      ctx.fillRect(X, Y, 1, 1);
    }
  }
}
const portrait = h > w;
const big = Math.round(Math.min(w, h) * (portrait ? 0.17 : 0.16));
pixelText('PLANETFALL', big, Math.round(h * (portrait ? 0.42 : 0.4)), '#ffe08a', '#ff7a1f');
pixelText('CONQUEST', Math.round(big * 0.62), Math.round(h * (portrait ? 0.42 : 0.4) + big * 0.82), '#d8c4ff', '#9a6bff');

const c = document.getElementById('c');
c.width = w * s; c.height = h * s;
const out = c.getContext('2d');
out.imageSmoothingEnabled = false;
out.drawImage(low, 0, 0, c.width, c.height);
document.title = 'ready';
</script>
